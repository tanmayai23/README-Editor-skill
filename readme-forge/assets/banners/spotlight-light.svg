<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t"><title id="t">readme-forge — READMEs that look as good as your code</title><style>@keyframes breathe{0%,100%{opacity:1}50%{opacity:.72}}.beam{animation:breathe 7s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0D0E10" stroke-opacity="0.08" stroke-width="1"/></pattern><radialGradient id="fade" cx=".5" cy=".35" r=".62"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="gm"><rect width="1280" height="320" fill="url(#fade)"/></mask><radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#5E6AD2" stop-opacity="0.3"/><stop offset=".55" stop-color="#9333EA" stop-opacity="0.08"/><stop offset="1" stop-color="#5E6AD2" stop-opacity="0"/></radialGradient><linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D0E10" stop-opacity="0.1"/><stop offset="1" stop-color="#0D0E10" stop-opacity="0"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="14"/></filter><linearGradient id="pillb" x1="0" x2="1"><stop offset="0" stop-color="#0D0E10" stop-opacity=".14"/><stop offset=".5" stop-color="#5E6AD2" stop-opacity=".9"/><stop offset="1" stop-color="#0D0E10" stop-opacity=".14"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/></linearGradient><linearGradient id="tgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D0E10"/><stop offset="1" stop-color="#0D0E10" stop-opacity="0.78"/></linearGradient></defs><rect width="1280" height="320" fill="#FBFBFC"/><rect width="1280" height="320" fill="url(#grid)" mask="url(#gm)"/><ellipse class="beam" cx="640.0" cy="0" rx="538" ry="304" fill="url(#glow)"/><polygon points="600.0,0 680.0,0 896,320 384,320" fill="url(#cone)" filter="url(#soft)"/><rect x="256" y="0" width="768" height="1" fill="#5E6AD2" opacity=".7"/><rect x="562" y="90" width="156" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.95" stroke="url(#pillb)" stroke-width="1"/><circle cx="580" cy="107" r="4" fill="#5E6AD2"/><text x="592" y="112" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0D0E10">Claude skill</text><text x="696" y="112" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="14" fill="#5C616B">→</text><text x="640.0" y="197" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.2" fill="url(#tgrad)">readme-forge</text><text x="640.0" y="233" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="20" fill="#5C616B">READMEs that look as good as your code</text><rect x="0" y="319" width="1280" height="1" fill="#0D0E10" opacity="0.1"/></svg>
