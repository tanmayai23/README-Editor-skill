ent><pattern id="pt2" width="46" height="320" patternUnits="userSpaceOnUse"><rect width="46" height="320" fill="url(#sl2)"/></pattern><linearGradient id="seam" x1="0" x2="1"><stop offset="0" stop-color="#0B0B12" stop-opacity="0"/><stop offset=".5" stop-color="#0B0B12" stop-opacity="0.35"/><stop offset="1" stop-color="#0B0B12" stop-opacity="0"/></linearGradient><radialGradient id="scrim"><stop offset="0" stop-color="#FAFAFC" stop-opacity="0.97"/><stop offset=".6" stop-color="#FAFAFC" stop-opacity="0.53"/><stop offset="1" stop-color="#FAFAFC" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="320" fill="#FAFAFC"/><g mask="url(#pm)" style="isolation:isolate"><rect class="pr0" x="-102.1" y="0" width="1464" height="320" fill="url(#pt0)" style="mix-blend-mode:multiply"/><rect class="pr1" x="-92.0" y="0" width="1464" height="320" fill="url(#pt1)" style="mix-blend-mode:multiply"/><rect class="pr2" x="-81.9" y="0" width="1464" height="320" fill="url(#pt2)" style="mix-blend-mode:multiply"/></g><rect class="seam" x="-154" y="0" width="102" height="320" fill="url(#seam)"/><ellipse cx="640.0" cy="160.0" rx="512" ry="147" fill="url(#scrim)"/><text class="tag fade d1" x="640.0" y="104.3" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4.5" fill="#00B8D9">CLAUDE SKILL</text><text class="title fade d2" x="640.0" y="183.1" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.4" fill="#0B0B12">readme-forge</text><text class="sub fade d3" x="640.0" y="223.9" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="24" font-weight="500" fill="#4E4E5C">READMEs that look as good as your code</text></svg>
