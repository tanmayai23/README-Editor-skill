<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t"><title id="t">readme-forge — READMEs that look as good as your code</title><style>@keyframes na{0%,100%{transform:translate(0,0)}50%{transform:translate(64px,26px)}}@keyframes nb{0%,100%{transform:translate(0,0)}50%{transform:translate(-77px,-19px)}}.na{animation:na 19s ease-in-out infinite}.nb{animation:nb 23s ease-in-out infinite}@keyframes bm0{from{stroke-dashoffset:3121}to{stroke-dashoffset:0}}.beam0{animation:bm0 7s linear 0.00s infinite}@keyframes bm1{from{stroke-dashoffset:3121}to{stroke-dashoffset:0}}.beam1{animation:bm1 7s linear -0.04s infinite}@keyframes bm2{from{stroke-dashoffset:3121}to{stroke-dashoffset:0}}.beam2{animation:bm2 7s linear -0.08s infinite}@keyframes bm3{from{stroke-dashoffset:3121}to{stroke-dashoffset:0}}.beam3{animation:bm3 7s linear -0.12s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><filter id="neb" x="-30%" y="-60%" width="160%" height="220%"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.012" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="140" xChannelSelector="R" yChannelSelector="B" result="d"/><feGaussianBlur in="d" stdDeviation="29"/></filter><radialGradient id="scrim"><stop offset="0" stop-color="#F8FAFE" stop-opacity="0.85"/><stop offset=".6" stop-color="#F8FAFE" stop-opacity="0.47"/><stop offset="1" stop-color="#F8FAFE" stop-opacity="0"/></radialGradient><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.07"/></feComponentTransfer></filter><filter id="bglow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><rect width="1280" height="320" fill="#F8FAFE"/><g filter="url(#neb)" opacity="0.45"><ellipse class="na" cx="230" cy="96" rx="282" ry="109" fill="#2F6CC0"/><ellipse class="nb" cx="640" cy="272" rx="333" ry="96" fill="#6E35A8"/><ellipse class="na" cx="1075" cy="80" rx="256" ry="115" fill="#0B7FAA"/></g><ellipse cx="640.0" cy="160.0" rx="461" ry="134" fill="url(#scrim)"/><rect width="1280" height="320" filter="url(#grain)"/><rect x="6" y="6" width="1268" height="308" rx="18" fill="none" stroke="#0C131D" stroke-opacity="0.14"/><rect class="beam0" x="6" y="6" width="1268" height="308" rx="18" fill="none" stroke="#0B7FAA" stroke-width="14" stroke-opacity="0.9" stroke-linecap="round" stroke-dasharray="687 2434" pathLength="3121" filter="url(#bglow)" transform="translate(0 0)"/><rect class="beam1" x="6" y="6" width="1268" height="308" rx="18" fill="none" stroke="#2F6CC0" stroke-width="3" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="687 2434" pathLength="3121" transform="translate(-1.2 1.2)"/><rect class="beam2" x="6" y="6" width="1268" height="308" rx="18" fill="none" stroke="#6E35A8" stroke-width="3" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="687 2434" pathLength="3121" transform="translate(1.2 -1.2)"/><rect class="beam3" x="6" y="6" width="1268" height="308" rx="18" fill="none" stroke="#0B7FAA" stroke-width="2" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="687 2434" pathLength="3121" transform="translate(0 0)"/><text class="tag fade d1" x="640.0" y="104.3" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4.5" fill="#0B7FAA">CLAUDE SKILL</text><text class="title fade d2" x="640.0" y="183.1" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.4" fill="#0C131D">readme-forge</text><text class="sub fade d3" x="640.0" y="223.9" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="24" font-weight="500" fill="#4A5568">READMEs that look as good as your code</text></svg>
