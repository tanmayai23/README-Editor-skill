<svg xmlns="http://www.w3.org/2000/svg" width="384" height="96" viewBox="0 0 384 96" role="img" aria-label="Transcribe — live demo"><title>Transcribe — live demo</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;font-kerning:normal}.mono{font-family:'Geist Mono', 'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace}.serif{font-family:'Instrument Serif', 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-weight:400}.glint{animation:glint 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
