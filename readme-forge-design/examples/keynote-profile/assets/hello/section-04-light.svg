<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-label="04 — Achievements, a few milestones"><title>04 — Achievements, a few milestones</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;font-kerning:normal}.mono{font-family:'Geist Mono', 'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace}.serif{font-family:'Instrument Serif', 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-weight:400}
.twinkle{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glint{animation:glint 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.1s steps(1) infinite}
.ripple{animation:ripple 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.breathe{animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drop{animation:drop 3.6s cubic-bezier(.55,0,.9,.5) infinite;transform-box:fill-box;transform-origin:center top}
.zoom{animation:zoom 18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.dash{animation:dash 6s linear infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes glint{0%,100%{opacity:.15;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes ripple{0%{opacity:.6;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@keyframes drop{0%,30%{opacity:0;transform:translateY(0) scale(.4)}40%{opacity:1;transform:translateY(0) scale(1)}85%{opacity:1;transform:translateY(70px) scale(1,1.15)}100%{opacity:0;transform:translateY(84px) scale(1.2,.6)}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes dash{to{stroke-dashoffset:-84}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs></defs><g class="up"><g transform="translate(30,58)"><path d="M0,-20 Q0,0 20,0 Q0,0 0,20 Q0,0 -20,0 Q0,0 0,-20Z" fill="#34A853" class="spin"/></g><text x="62.0" y="74.0" font-size="44" font-weight="600" fill="#1D1D1F" letter-spacing="-1.6">Achievements</text><text x="354.4" y="74.0" font-size="27" font-weight="400" fill="#6E6E73" class="serif">a few milestones</text><text x="1184.0" y="70.0" font-size="13" font-weight="500" fill="#6E6E73" text-anchor="end" letter-spacing="1" class="mono">04 / 05</text><line x1="16" y1="102" x2="1184" y2="102" stroke="#E3E3E8" stroke-width="1.5"/><line x1="16" y1="102" x2="96" y2="102" stroke="#34A853" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(1084.0,40.0)"><path d="M0,-11.2 Q0,0 11.2,0 Q0,0 0,11.2 Q0,0 -11.2,0 Q0,0 0,-11.2Z" fill="#EA4335" class="twinkle" style="animation-delay:2.34s"/></g><g transform="translate(1050.0,70.0)"><path d="M0,-6.4 Q0,0 6.4,0 Q0,0 0,6.4 Q0,0 -6.4,0 Q0,0 0,-6.4Z" fill="#34A853" class="glint" style="animation-delay:1.73s"/></g><g transform="translate(1112.0,82.0)"><path d="M0,-8.0 Q0,0 8.0,0 Q0,0 0,8.0 Q0,0 -8.0,0 Q0,0 0,-8.0Z" fill="#4285F4" class="glint" style="animation-delay:0.76s"/></g><g transform="translate(960.0,36.0)"><path d="M0,-6.4 Q0,0 6.4,0 Q0,0 0,6.4 Q0,0 -6.4,0 Q0,0 0,-6.4Z" fill="#EA4335" class="glint" style="animation-delay:0.73s"/></g></svg>
