<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-label="Tidewatch — flood-risk forecasting — 6 h earlier warnings, −40% false alarms, 120 sensors simulated"><title>Tidewatch — flood-risk forecasting — 6 h earlier warnings, −40% false alarms, 120 sensors simulated</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;font-kerning:normal}.mono{font-family:'Geist Mono', 'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace}.serif{font-family:'Instrument Serif', 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-weight:400}.twinkle{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.glint{animation:glint 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glint{0%,100%{opacity:.15;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.ripple{animation:ripple 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{opacity:.6;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}
.dash{animation:dash 6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-84}}
