<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="544" viewBox="0 0 1200 544" role="img" aria-label="About: I turn prototypes into things people use. Building LLM workflows and voice interfaces; Exploring Retrieval, evaluation and fine-tuning; Leading Lumen Labs — a fictional studio for this demo; Open to Open-source collaborations and mentoring"><title>About: I turn prototypes into things people use. Building LLM workflows and voice interfaces; Exploring Retrieval, evaluation and fine-tuning; Leading Lumen Labs — a fictional studio for this demo; Open to Open-source collaborations and mentoring</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;font-kerning:normal}.mono{font-family:'Geist Mono', 'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace}.serif{font-family:'Instrument Serif', 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-weight:400}.twinkle{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.glint{animation:glint 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glint{0%,100%{opacity:.15;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs></defs><rect x="16" y="10" width="1168" height="524" rx="32" fill="#161B22"/><g class="up"><text x="88.0" y="86.0" font-size="12.5" font-weight="500" fill="#8B949E" letter-spacing="3" class="mono">ABOUT</text><text x="85.0" y="160.5" font-size="54" font-weight="600" fill="#F5F5F7" letter-spacing="-2.376" xml:space="preserve">I turn prototypes</text><text x="85.0" y="222.6" font-size="54" font-weight="600" fill="#F5F5F7" letter-spacing="-2.376" xml:space="preserve">into <tspan class="serif" fill="#8AB4F8" font-size="62" letter-spacing="0">things</tspan> <tspan class="serif" fill="#8AB4F8" font-size="62" letter-spacing="0">people</tspan></text><text x="85.0" y="284.7" font-size="54" font-weight="600" fill="#F5F5F7" letter-spacing="-2.376" xml:space="preserve"><tspan class="serif" fill="#8AB4F8" font-size="62" letter-spacing="0">use.</tspan></text></g><g class="up"><text x="88.0" y="352.8" font-size="18" font-weight="400" fill="#D0D7DE">Models, data and APIs shaped into small, reliable tools —</text><text x="88.0" y="378.8" font-size="18" font-weight="400" fill="#D0D7DE">shipped, measured and improved after launch.</text><text x="88.0" y="434.8" font-size="24" font-weight="400" fill="#8B949E" class="serif">“Make it work, make it clear, then make it</text><text x="88.0" y="464.8" font-size="24" font-weight="400" fill="#8B949E" class="serif">fast.”</text></g><line x1="640" y1="70" x2="640" y2="474" stroke="#30363D" stroke-width="1.5"/><text x="676.0" y="86.0" font-size="12.5" font-weight="500" fill="#8B949E" letter-spacing="3" class="mono up">RIGHT NOW</text><g class="up"><g transform="translate(680.0,118.0)"><path d="M0,-10.0 Q0,0 10.0,0 Q0,0 0,10.0 Q0,0 -10.0,0 Q0,0 0,-10.0Z" fill="#8AB4F8" class="twinkle" style="animation-delay:0.00s"/></g><text x="700.0" y="124.0" font-size="18" font-weight="600" fill="#F5F5F7" letter-spacing="-0.2">Building</text><text x="700.0" y="149.0" font-size="16" font-weight="400" fill="#8B949E">LLM workflows and voice interfaces</text></g><g class="up"><g transform="translate(680.0,184.0)"><path d="M0,-10.0 Q0,0 10.0,0 Q0,0 0,10.0 Q0,0 -10.0,0 Q0,0 0,-10.0Z" fill="#F28B82" class="twinkle" style="animation-delay:0.60s"/></g><text x="700.0" y="190.0" font-size="18" font-weight="600" fill="#F5F5F7" letter-spacing="-0.2">Exploring</text><text x="700.0" y="215.0" font-size="16" font-weight="400" fill="#8B949E">Retrieval, evaluation and fine-tuning</text></g><g class="up"><g transform="translate(680.0,250.0)"><path d="M0,-10.0 Q0,0 10.0,0 Q0,0 0,10.0 Q0,0 -10.0,0 Q0,0 0,-10.0Z" fill="#FDD663" class="twinkle" style="animation-delay:1.20s"/></g><text x="700.0" y="256.0" font-size="18" font-weight="600" fill="#F5F5F7" letter-spacing="-0.2">Leading</text><text x="700.0" y="281.0" font-size="16" font-weight="400" fill="#8B949E">Lumen Labs — a fictional studio for this demo</text></g><g class="up"><g transform="translate(680.0,316.0)"><path d="M0,-10.0 Q0,0 10.0,0 Q0,0 0,10.0 Q0,0 -10.0,0 Q0,0 0,-10.0Z" fill="#81C995" class="twinkle" style="animation-delay:1.80s"/></g><text x="700.0" y="322.0" font-size="18" font-weight="600" fill="#F5F5F7" letter-spacing="-0.2">Open to</text><text x="700.0" y="347.0" font-size="16" font-weight="400" fill="#8B949E">Open-source collaborations and mentoring</text></g><g transform="translate(1140.0,52.0)"><path d="M0,-17.6 Q0,0 17.6,0 Q0,0 0,17.6 Q0,0 -17.6,0 Q0,0 0,-17.6Z" fill="#F28B82" class="twinkle" style="animation-delay:0.99s"/></g><g transform="translate(1110.0,80.0)"><path d="M0,-8.0 Q0,0 8.0,0 Q0,0 0,8.0 Q0,0 -8.0,0 Q0,0 0,-8.0Z" fill="#FDD663" class="glint" style="animation-delay:0.78s"/></g><g transform="translate(600.0,494.0)"><path d="M0,-12.8 Q0,0 12.8,0 Q0,0 0,12.8 Q0,0 -12.8,0 Q0,0 0,-12.8Z" fill="#8AB4F8" class="twinkle" style="animation-delay:2.10s"/></g><g transform="translate(560.0,64.0)"><path d="M0,-8.0 Q0,0 8.0,0 Q0,0 0,8.0 Q0,0 -8.0,0 Q0,0 0,-8.0Z" fill="#8AB4F8" class="glint" style="animation-delay:1.05s"/></g><g transform="translate(1150.0,504.0)"><path d="M0,-9.6 Q0,0 9.6,0 Q0,0 0,9.6 Q0,0 -9.6,0 Q0,0 0,-9.6Z" fill="#F28B82" class="twinkle" style="animation-delay:2.75s"/></g></svg>
