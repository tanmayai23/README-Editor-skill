"9" fill="#F28B82"/><circle cx="898" cy="201" r="14" fill="#F28B82" class="ripple" style="animation-delay:0.5s"/><circle cx="970" cy="142" r="6" fill="#FDD663"/><circle cx="970" cy="142" r="14" fill="#FDD663" class="ripple" style="animation-delay:1.0s"/><circle cx="1048" cy="216" r="9" fill="#81C995"/><circle cx="1048" cy="216" r="14" fill="#81C995" class="ripple" style="animation-delay:1.5s"/><circle cx="865" cy="256" r="6" fill="#8AB4F8"/><circle cx="865" cy="256" r="14" fill="#8AB4F8" class="ripple" style="animation-delay:2.0s"/><circle cx="994" cy="265" r="9" fill="#F28B82"/><circle cx="994" cy="265" r="14" fill="#F28B82" class="ripple" style="animation-delay:2.5s"/><text x="756.0" y="325.0" font-size="10.0" font-weight="400" fill="#8B949E" class="mono">Python · Forecasting · Next.js · Maps</text><text x="1120.0" y="325.0" font-size="13.5" font-weight="600" fill="#8AB4F8" text-anchor="end">Open live ↗</text><g transform="translate(690.0,40.0)"><path d="M0,-14.4 Q0,0 14.4,0 Q0,0 0,14.4 Q0,0 -14.4,0 Q0,0 0,-14.4Z" fill="#81C995" class="twinkle" style="animation-delay:1.77s"/></g><g transform="translate(700.0,355.0)"><path d="M0,-8.0 Q0,0 8.0,0 Q0,0 0,8.0 Q0,0 -8.0,0 Q0,0 0,-8.0Z" fill="#81C995" class="glint" style="animation-delay:2.78s"/></g><g transform="translate(40.0,355.0)"><path d="M0,-9.6 Q0,0 9.6,0 Q0,0 0,9.6 Q0,0 -9.6,0 Q0,0 0,-9.6Z" fill="#81C995" class="twinkle" style="animation-delay:1.80s"/></g><g transform="translate(1160.0,30.0)"><path d="M0,-11.2 Q0,0 11.2,0 Q0,0 0,11.2 Q0,0 -11.2,0 Q0,0 0,-11.2Z" fill="#FDD663" class="twinkle" style="animation-delay:1.68s"/></g></svg>
