 class="breathe" style="animation-delay:1.05s"/><rect x="508" y="90" width="7" height="48" rx="3.6" fill="#4285F4" class="breathe" style="animation-delay:1.20s"/><rect x="523" y="99" width="7" height="30" rx="3.6" fill="#EA4335" class="breathe" style="animation-delay:1.35s"/><rect x="537" y="77" width="7" height="73" rx="3.6" fill="#FBBC04" class="breathe" style="animation-delay:1.50s"/><circle cx="540" cy="300" r="18" fill="#FFFFFF" stroke="#E3E3E8"/><path d="M533.7,306.3 L546.3,293.7 M535.6,293.7 H546.3 V304.4" fill="none" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(548.0,230.0)"><path d="M0,-11.2 Q0,0 11.2,0 Q0,0 0,11.2 Q0,0 -11.2,0 Q0,0 0,-11.2Z" fill="#34A853" class="twinkle" style="animation-delay:2.68s"/></g><g transform="translate(360.0,44.0)"><path d="M0,-8.0 Q0,0 8.0,0 Q0,0 0,8.0 Q0,0 -8.0,0 Q0,0 0,-8.0Z" fill="#EA4335" class="glint" style="animation-delay:1.42s"/></g><g transform="translate(510.0,270.0)"><path d="M0,-6.4 Q0,0 6.4,0 Q0,0 0,6.4 Q0,0 -6.4,0 Q0,0 0,-6.4Z" fill="#4285F4" class="glint" style="animation-delay:0.69s"/></g></svg>
