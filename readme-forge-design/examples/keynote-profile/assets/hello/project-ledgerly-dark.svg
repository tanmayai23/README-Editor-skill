elay:0.60s"/><circle cx="434" cy="150" r="4" fill="#8B949E" class="blink" style="animation-delay:0.85s"/><circle cx="450" cy="150" r="4" fill="#8B949E" class="blink" style="animation-delay:1.10s"/><circle cx="540" cy="300" r="18" fill="#21262D" stroke="#30363D"/><path d="M533.7,306.3 L546.3,293.7 M535.6,293.7 H546.3 V304.4" fill="none" stroke="#F5F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(548.0,230.0)"><path d="M0,-11.2 Q0,0 11.2,0 Q0,0 0,11.2 Q0,0 -11.2,0 Q0,0 0,-11.2Z" fill="#F28B82" class="twinkle" style="animation-delay:1.48s"/></g><g transform="translate(360.0,44.0)"><path d="M0,-8.0 Q0,0 8.0,0 Q0,0 0,8.0 Q0,0 -8.0,0 Q0,0 0,-8.0Z" fill="#8AB4F8" class="glint" style="animation-delay:2.14s"/></g><g transform="translate(510.0,270.0)"><path d="M0,-6.4 Q0,0 6.4,0 Q0,0 0,6.4 Q0,0 -6.4,0 Q0,0 0,-6.4Z" fill="#FDD663" class="glint" style="animation-delay:0.39s"/></g></svg>
