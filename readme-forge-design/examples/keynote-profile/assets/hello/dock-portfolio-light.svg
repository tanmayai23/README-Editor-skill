<svg xmlns="http://www.w3.org/2000/svg" width="144" height="176" viewBox="0 0 144 176" role="img" aria-label="Portfolio — example.com"><title>Portfolio — example.com</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;font-kerning:normal}.mono{font-family:'Geist Mono', 'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace}.serif{font-family:'Instrument Serif', 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-weight:400}
.twinkle{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glint{animation:glint 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.1s steps(1) infinite}
.ripple{animation:ripple 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.breathe{animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drop{animation:drop 3.6s cubic-bezier(.55,0,.9,.5) infinite;transform-box:fill-box;transform-origin:center top}
.zoom{animation:zoom 18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.dash{animation:dash 6s linear infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes glint{0%,100%{opacity:.15;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes ripple{0%{opacity:.6;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@keyframes drop{0%,30%{opacity:0;transform:translateY(0) scale(.4)}40%{opacity:1;transform:translateY(0) scale(1)}85%{opacity:1;transform:translateY(70px) scale(1,1.15)}100%{opacity:0;transform:translateY(84px) scale(1.2,.6)}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes dash{to{stroke-dashoffset:-84}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs></defs><defs><linearGradient id="dsheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#F5F5F7"/></linearGradient></defs><rect x="24" y="12" width="96" height="96" rx="26" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1.5"/><rect x="24" y="12" width="96" height="96" rx="26" fill="url(#dsheen)"/><path transform="translate(52.0,40.0) scale(1.6667)" d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM3 12h18M12 3c2.6 2.7 3.8 5.7 3.8 9s-1.2 6.3-3.8 9c-2.6-2.7-3.8-5.7-3.8-9S9.4 5.7 12 3z" fill="none" stroke="#4285F4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="72.0" y="140.0" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="middle" letter-spacing="-0.3">Portfolio</text><text x="72.0" y="162.0" font-size="15" font-weight="400" fill="#6E6E73" text-anchor="middle" class="serif">example.com</text><g transform="translate(116.0,16.0)"><path d="M0,-14.4 Q0,0 14.4,0 Q0,0 0,14.4 Q0,0 -14.4,0 Q0,0 0,-14.4Z" fill="#EA4335" class="twinkle" style="animation-delay:1.81s"/></g><g transform="translate(20.0,100.0)"><path d="M0,-6.4 Q0,0 6.4,0 Q0,0 0,6.4 Q0,0 -6.4,0 Q0,0 0,-6.4Z" fill="#EA4335" class="glint" style="animation-delay:0.54s"/></g></svg>
