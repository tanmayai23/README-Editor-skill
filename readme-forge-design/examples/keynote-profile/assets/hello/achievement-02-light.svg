<svg xmlns="http://www.w3.org/2000/svg" width="590" height="430" viewBox="0 0 590 430" role="img" aria-label="City Hack — Track winner — Won the climate track with an early Tidewatch prototype."><title>City Hack — Track winner — Won the climate track with an early Tidewatch prototype.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;font-kerning:normal}.mono{font-family:'Geist Mono', 'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace}.serif{font-family:'Instrument Serif', 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-weight:400}.twinkle{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.glint{animation:glint 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glint{0%,100%{opacity:.15;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
