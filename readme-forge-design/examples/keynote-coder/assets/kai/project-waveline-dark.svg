<svg xmlns="http://www.w3.org/2000/svg" width="590" height="350" viewBox="0 0 590 350" role="img" aria-label="Waveline — audio visualiser — 3 themes"><title>Waveline — audio visualiser — 3 themes</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;font-kerning:normal}.mono{font-family:'Geist Mono', 'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace}.serif{font-family:'Instrument Serif', 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-weight:400}.twinkle{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.glint{animation:glint 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glint{0%,100%{opacity:.15;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.breathe{animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs></defs><rect x="10" y="10" width="570" height="330" rx="30" fill="#161B22"/><g class="up"><rect x="36.0" y="40" width="83.4" height="26" rx="13.0" fill="#21262D" stroke="#30363D"/><text x="77.7" y="57.0" font-size="11" font-weight="600" fill="#F472B6" text-anchor="middle" letter-spacing="1.2" class="mono">DESKTOP</text></g><g class="up"><text x="34.0" y="118.0" font-size="40" font-weight="700" fill="#F5F5F7" letter-spacing="-1.6">Waveline</text><text x="36.0" y="148.0" font-size="21" font-weight="400" fill="#8B949E" class="serif">audio visualiser</text></g><g class="up"><text x="36.0" y="188.0" font-size="15" font-weight="400" fill="#D0D7DE">Turns whatever is playing into soft ambient waves on the desktop.</text></g><g class="up"><rect x="36.0" y="221" width="92.7" height="32" rx="16.0" fill="#F5F5F7"/><text x="82.3" y="241.9" font-size="13.5" font-weight="600" fill="#161B22" text-anchor="middle">3 themes</text></g><text x="36.0" y="308.0" font-size="11.5" font-weight="400" fill="#8B949E" class="mono">Electron · TypeScript</text><rect x="392" y="95" width="7" height="39" rx="3.6" fill="#A78BFA" class="breathe" style="animation-delay:0.00s"/><rect x="407" y="64" width="7" height="99" rx="3.6" fill="#F472B6" class="breathe" style="animation-delay:0.15s"/><rect x="421" y="82" width="7" height="65" rx="3.6" fill="#22D3EE" class="breathe" style="animation-delay:0.30s"/><rect x="436" y="99" width="7" height="30" rx="3.6" fill="#A3E635" class="breathe" style="animation-delay:0.45s"/><rect x="450" y="69" width="7" height="91" rx="3.6" fill="#A78BFA" class="breathe" style="animation-delay:0.60s"/><rect x="465" y="86" width="7" height="56" rx="3.6" fill="#F472B6" class="breathe" style="animation-delay:0.75s"/><rect x="479" y="103" width="7" height="22" rx="3.6" fill="#22D3EE" class="breathe" style="animation-delay:0.90s"/><rect x="494" y="73" width="7" height="82" rx="3.6" fill="#A3E635" class="breathe" style="animation-delay:1.05s"/><rect x="508" y="90" width="7" height="48" rx="3.6" fill="#A78BFA" class="breathe" style="animation-delay:1.20s"/><rect x="523" y="99" width="7" height="30" rx="3.6" fill="#F472B6" class="breathe" style="animation-delay:1.35s"/><rect x="537" y="77" width="7" height="73" rx="3.6" fill="#22D3EE" class="breathe" style="animation-delay:1.50s"/><g transform="translate(548.0,230.0)"><path d="M0,-11.2 Q0,0 11.2,0 Q0,0 0,11.2 Q0,0 -11.2,0 Q0,0 0,-11.2Z" fill="#A3E635" class="twinkle" style="animation-delay:0.30s"/></g><g transform="translate(360.0,44.0)"><path d="M0,-8.0 Q0,0 8.0,0 Q0,0 0,8.0 Q0,0 -8.0,0 Q0,0 0,-8.0Z" fill="#F472B6" class="glint" style="animation-delay:0.12s"/></g><g transform="translate(510.0,270.0)"><path d="M0,-6.4 Q0,0 6.4,0 Q0,0 0,6.4 Q0,0 -6.4,0 Q0,0 0,-6.4Z" fill="#A78BFA" class="glint" style="animation-delay:2.55s"/></g></svg>
