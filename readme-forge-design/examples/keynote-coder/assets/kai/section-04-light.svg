<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-label="04 — Badges, earned along the way"><title>04 — Badges, earned along the way</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;font-kerning:normal}.mono{font-family:'Geist Mono', 'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace}.serif{font-family:'Instrument Serif', 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-weight:400}.twinkle{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.glint{animation:glint 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glint{0%,100%{opacity:.15;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs></defs><g class="up"><g transform="translate(30,58)"><path d="M0,-20 Q0,0 20,0 Q0,0 0,20 Q0,0 -20,0 Q0,0 0,-20Z" fill="#65A30D" class="spin"/></g><text x="62.0" y="74.0" font-size="44" font-weight="600" fill="#1D1D1F" letter-spacing="-1.6">Badges</text><text x="223.5" y="74.0" font-size="27" font-weight="400" fill="#6E6E73" class="serif">earned along the way</text><text x="1184.0" y="70.0" font-size="13" font-weight="500" fill="#6E6E73" text-anchor="end" letter-spacing="1" class="mono">04 / 05</text><line x1="16" y1="102" x2="1184" y2="102" stroke="#E3E3E8" stroke-width="1.5"/><line x1="16" y1="102" x2="96" y2="102" stroke="#65A30D" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(1084.0,40.0)"><path d="M0,-11.2 Q0,0 11.2,0 Q0,0 0,11.2 Q0,0 -11.2,0 Q0,0 0,-11.2Z" fill="#0891B2" class="twinkle" style="animation-delay:0.79s"/></g><g transform="translate(1050.0,70.0)"><path d="M0,-6.4 Q0,0 6.4,0 Q0,0 0,6.4 Q0,0 -6.4,0 Q0,0 0,-6.4Z" fill="#7C3AED" class="glint" style="animation-delay:1.18s"/></g><g transform="translate(1112.0,82.0)"><path d="M0,-8.0 Q0,0 8.0,0 Q0,0 0,8.0 Q0,0 -8.0,0 Q0,0 0,-8.0Z" fill="#0891B2" class="glint" style="animation-delay:2.16s"/></g><g transform="translate(960.0,36.0)"><path d="M0,-6.4 Q0,0 6.4,0 Q0,0 0,6.4 Q0,0 -6.4,0 Q0,0 0,-6.4Z" fill="#7C3AED" class="glint" style="animation-delay:0.59s"/></g></svg>
