">Ship the README.</text><g class="up"><text x="296.0" y="382.0" font-size="19" font-weight="400" fill="#8B949E" letter-spacing="0.0" xml:space="preserve">MIT License</text><g transform="translate(412.2,375.0)"><path d="M0,-8.9 Q0,0 8.9,0 Q0,0 0,8.9 Q0,0 -8.9,0 Q0,0 0,-8.9Z" fill="#F472B6" class="twinkle" style="animation-delay:0.70s"/></g><text x="437.9" y="382.0" font-size="19" font-weight="400" fill="#8B949E" letter-spacing="0.0" xml:space="preserve">github.com/tanmayai23/README-Editor-skill</text></g></g><g transform="translate(22.0,250.0)"><path d="M0,-14.4 Q0,0 14.4,0 Q0,0 0,14.4 Q0,0 -14.4,0 Q0,0 0,-14.4Z" fill="#F472B6" class="twinkle" style="animation-delay:2.14s"/></g><g transform="translate(1180.0,150.0)"><path d="M0,-16.0 Q0,0 16.0,0 Q0,0 0,16.0 Q0,0 -16.0,0 Q0,0 0,-16.0Z" fill="#22D3EE" class="twinkle" style="animation-delay:1.26s"/></g><g transform="translate(1180.0,345.0)"><path d="M0,-9.6 Q0,0 9.6,0 Q0,0 0,9.6 Q0,0 -9.6,0 Q0,0 0,-9.6Z" fill="#22D3EE" class="twinkle" style="animation-delay:1.17s"/></g><g transform="translate(60.0,580.0)"><path d="M0,-11.2 Q0,0 11.2,0 Q0,0 0,11.2 Q0,0 -11.2,0 Q0,0 0,-11.2Z" fill="#22D3EE" class="twinkle" style="animation-delay:0.61s"/></g><g transform="translate(1140.0,236.0)"><path d="M0,-12.8 Q0,0 12.8,0 Q0,0 0,12.8 Q0,0 -12.8,0 Q0,0 0,-12.8Z" fill="#F472B6" class="twinkle" style="animation-delay:0.65s"/></g><g transform="translate(1130.0,300.0)"><path d="M0,-8.0 Q0,0 8.0,0 Q0,0 0,8.0 Q0,0 -8.0,0 Q0,0 0,-8.0Z" fill="#22D3EE" class="glint" style="animation-delay:2.72s"/></g></svg>
