<svg xmlns="http://www.w3.org/2000/svg" width="590" height="350" viewBox="0 0 590 350" role="img" aria-label="GitHub Action — one PR comment — uses: …@v1"><title>GitHub Action — one PR comment — uses: …@v1</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;font-kerning:normal}.mono{font-family:'Geist Mono', 'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace}.serif{font-family:'Instrument Serif', 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-weight:400}
.twinkle{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glint{animation:glint 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.1s steps(1) infinite}
.ripple{animation:ripple 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.breathe{animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drop{animation:drop 3.6s cubic-bezier(.55,0,.9,.5) infinite;transform-box:fill-box;transform-origin:center top}
.zoom{animation:zoom 18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.dash{animation:dash 6s linear infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes glint{0%,100%{opacity:.15;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes ripple{0%{opacity:.6;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@keyframes drop{0%,30%{opacity:0;transform:translateY(0) scale(.4)}40%{opacity:1;transform:translateY(0) scale(1)}85%{opacity:1;transform:translateY(70px) scale(1,1.15)}100%{opacity:0;transform:translateY(84px) scale(1.2,.6)}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes dash{to{stroke-dashoffset:-84}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs></defs><rect x="10" y="10" width="570" height="330" rx="30" fill="#161B22"/><g class="up"><rect x="36.0" y="40" width="67.8" height="26" rx="13.0" fill="#21262D" stroke="#30363D"/><text x="69.9" y="57.0" font-size="11" font-weight="600" fill="#22D3EE" text-anchor="middle" letter-spacing="1.2" class="mono">IN CI</text></g><g class="up"><text x="34.0" y="118.0" font-size="40" font-weight="700" fill="#F5F5F7" letter-spacing="-1.6">GitHub Action</text><text x="36.0" y="148.0" font-size="21" font-weight="400" fill="#8B949E" class="serif">one PR comment</text></g><g class="up"><text x="36.0" y="188.0" font-size="15" font-weight="400" fill="#D0D7DE">Scores and fact-checks READMEs on pull requests and can fail below a</text><text x="36.0" y="211.0" font-size="15" font-weight="400" fill="#D0D7DE">minimum score.</text></g><g class="up"><rect x="36.0" y="244" width="110.3" height="32" rx="16.0" fill="#F5F5F7"/><text x="91.1" y="264.9" font-size="13.5" font-weight="600" fill="#161B22" text-anchor="middle">uses: …@v1</text></g><linearGradient id="areaGit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".25"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient><path d="M392,146 L415,130 L438,136 L461,114 L483,119 L506,92 L529,101 L552,71 L552,168 L392,168Z" fill="url(#areaGit)"/><path d="M392,146 L415,130 L438,136 L461,114 L483,119 L506,92 L529,101 L552,71" fill="none" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="552" cy="71" r="6" fill="#A3E635"/><circle cx="552" cy="71" r="14" fill="#A3E635" class="ripple"/><g transform="translate(548.0,230.0)"><path d="M0,-11.2 Q0,0 11.2,0 Q0,0 0,11.2 Q0,0 -11.2,0 Q0,0 0,-11.2Z" fill="#22D3EE" class="twinkle" style="animation-delay:2.65s"/></g><g transform="translate(360.0,44.0)"><path d="M0,-8.0 Q0,0 8.0,0 Q0,0 0,8.0 Q0,0 -8.0,0 Q0,0 0,-8.0Z" fill="#F472B6" class="glint" style="animation-delay:0.07s"/></g><g transform="translate(510.0,270.0)"><path d="M0,-6.4 Q0,0 6.4,0 Q0,0 0,6.4 Q0,0 -6.4,0 Q0,0 0,-6.4Z" fill="#22D3EE" class="glint" style="animation-delay:1.04s"/></g></svg>
