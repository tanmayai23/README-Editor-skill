name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Scripts and README
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Python runs on Windows, where setup-python still ships it;
        # newer Ubuntu runner images may drop 3.8.
        include:
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile scripts
        shell: bash
        run: python -m py_compile readme-forge/scripts/*.py
      - name: Analyzer runs on the sample app
        run: python readme-forge/scripts/analyze_repo.py demo/sample-app --compact
      - name: Import graph runs on the sample app
        run: python readme-forge/scripts/import_graph.py demo/sample-app
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Project README scores 85+
        run: python readme-forge/scripts/score_readme.py README.md --repo . --min 85
      - name: Skill README scores 85+
        run: python readme-forge/scripts/score_readme.py readme-forge/README.md --min 85
      - name: Hugging Face card templates score
        shell: bash
        run: for f in readme-forge/templates/huggingface/*.md; do python readme-forge/scripts/score_readme.py "$f" --hf; done
      - name: Profile templates score
        shell: bash
        run: for f in readme-forge/templates/profile/*.md; do python readme-forge/scripts/score_readme.py "$f" --profile > /dev/null; done
      - name: Banner generator writes repo-relative paths
        shell: bash
        run: python readme-forge/scripts/make_banner.py --style aurora --title CI --out "$PWD/ci-out" | grep -q 'srcset="ci-out/header-dark.svg"'
      - name: Banner generator embeds a logo
        shell: bash
        run: |
          python readme-forge/scripts/make_banner.py --style spotlight --palette ghost --logo .github/assets/logo-320.png --title CI --out ci-logo > /dev/null
          grep -q 'href="data:image/png;base64,' ci-logo/header-dark.svg
      - name: Plugin manifests are valid and versions match
        run: python -c "import json; m=json.load(open('.claude-plugin/marketplace.json')); p=json.load(open('readme-forge/.claude-plugin/plugin.json')); assert m['plugins'][0]['version']==p['version'], 'bump the version in both manifests'"

  release:
    name: Attach skill zip to release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build readme-forge.zip
        run: zip -r readme-forge.zip readme-forge -x "*/__pycache__/*"
      - name: Extract this version's notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" readme-forge.zip demo/readme-forge-demo.gif --title "readme-forge $GITHUB_REF_NAME" --notes-file notes.md
