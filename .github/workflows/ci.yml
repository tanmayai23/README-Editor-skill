name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Scripts and README
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Python runs on Windows, where setup-python still ships it;
        # newer Ubuntu runner images may drop 3.8.
        include:
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile scripts
        shell: bash
        run: python -m py_compile readme-forge/scripts/*.py readme-forge-design/scripts/*.py action/report.py
      - name: Unit tests (15 ecosystems, import graphs, claim verifier, Action report)
        run: python -m unittest discover -s tests -v
      - name: Analyzer runs on the sample app
        run: python readme-forge/scripts/analyze_repo.py demo/sample-app --compact
      - name: Import graph runs on the sample app
        run: python readme-forge/scripts/import_graph.py demo/sample-app
      - name: Project README scores 85+
        run: python readme-forge/scripts/score_readme.py README.md --repo . --min 85
      - name: Every checked claim in the project README matches the code
        run: python readme-forge/scripts/verify_readme.py README.md --repo . --min-accuracy 100
      - name: Skill READMEs score 85+
        shell: bash
        run: |
          python readme-forge/scripts/score_readme.py readme-forge/README.md --min 85
          python readme-forge/scripts/score_readme.py readme-forge-design/README.md --min 85
      - name: Hugging Face card templates score
        shell: bash
        run: for f in readme-forge/templates/huggingface/*.md; do python readme-forge/scripts/score_readme.py "$f" --hf; done
      - name: Profile templates score
        shell: bash
        run: for f in readme-forge-design/templates/profile/*.md; do python readme-forge/scripts/score_readme.py "$f" --profile > /dev/null; done
      - name: Banner generator writes repo-relative paths
        shell: bash
        run: python readme-forge-design/scripts/make_banner.py --style aurora --title CI --out "$PWD/ci-out" | grep -q 'srcset="ci-out/header-dark.svg"'
      - name: Banner generator embeds a logo
        shell: bash
        run: |
          python readme-forge-design/scripts/make_banner.py --style spotlight --palette ghost --logo .github/assets/logo-320.png --title CI --out ci-logo > /dev/null
          grep -q 'href="data:image/png;base64,' ci-logo/header-dark.svg
      - name: Linked banner snippet keeps <a> and <picture> on separate lines
        shell: bash
        run: python readme-forge-design/scripts/make_banner.py --kind button --title Go --href "#go" --out ci-btn | grep -qx '<a href="#go">'
      - name: Fancy text maps letters, digits and Unicode holes
        shell: bash
        run: |
          test "$(python readme-forge-design/scripts/fancy_text.py 'Hi 7' --style sans-bold)" = "𝗛𝗶 𝟳"
          test "$(python readme-forge-design/scripts/fancy_text.py 'RCh' --style double-struck)" = "ℝℂ𝕙"
        env:
          PYTHONIOENCODING: utf-8
      - name: Tic-tac-toe game plays, rejects bad moves and detects a win
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          T="$PWD/readme-forge-design/templates/profile/game/tictactoe.py"
          mkdir ttt && cd ttt
          printf '<!-- TICTACTOE:START -->\n<!-- TICTACTOE:END -->\n' > README.md
          python "$T" --repo a/a --render
          for m in "a 1" "b 4" "c 2" "d 5"; do set -- $m; python "$T" --repo a/a --title "ttt|move|$2" --user "$1"; done
          ! python "$T" --repo a/a --title "ttt|move|1" --user e
          ! python "$T" --repo a/a --title 'ttt|move|3; rm -rf ~' --user e
          python "$T" --repo a/a --title "ttt|move|3" --user e | grep -q "wins"
          grep -q '"X": 1' .github/game/tictactoe.json
      - name: Shader banner styles render with CSS-only animation
        shell: bash
        run: |
          for s in vortex beam shatter prism; do
            python readme-forge-design/scripts/make_banner.py --style $s --title CI --out ci-shader --name $s > /dev/null
            ! grep -q '<animate' ci-shader/$s-dark.svg
          done
      - name: Plugin manifests are valid and versions match
        shell: bash
        run: |
          python - <<'EOF'
          import json
          market = {p["name"]: p["version"] for p in json.load(open(".claude-plugin/marketplace.json"))["plugins"]}
          for d in ("readme-forge", "readme-forge-design"):
              plugin = json.load(open(d + "/.claude-plugin/plugin.json"))
              assert market[plugin["name"]] == plugin["version"], "bump the version of " + d + " in both manifests"
          assert len(set(market.values())) == 1, "both plugins ship together; keep their versions equal"
          EOF

  release:
    name: Attach skill zip to release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the plugin version and has CHANGELOG notes
        run: |
          v=$(python -c "import json; print(json.load(open('readme-forge/.claude-plugin/plugin.json'))['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match plugin version $v"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - name: Build skill zips
        run: |
          zip -r readme-forge.zip readme-forge -x "*/__pycache__/*"
          zip -r readme-forge-design.zip readme-forge-design -x "*/__pycache__/*"
      - name: Extract this version's notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" readme-forge.zip readme-forge-design.zip demo/readme-forge-demo.gif --title "readme-forge $GITHUB_REF_NAME" --notes-file notes.md
