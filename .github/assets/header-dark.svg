<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t"><title id="t">readme-forge — READMEs that look as good as your code</title><style>@keyframes breathe{0%,100%{opacity:1}50%{opacity:.72}}.beam{animation:breathe 7s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/></pattern><radialGradient id="fade" cx=".5" cy=".35" r=".62"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="gm"><rect width="1280" height="320" fill="url(#fade)"/></mask><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF8A3D" stop-opacity="0.55"/><stop offset=".55" stop-color="#C084FC" stop-opacity="0.14"/><stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/></radialGradient><linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F8F8" stop-opacity="0.2"/><stop offset="1" stop-color="#F7F8F8" stop-opacity="0"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="14"/></filter><linearGradient id="pillb" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset=".5" stop-color="#FF8A3D" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".14"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/></linearGradient><linearGradient id="tgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F8F8"/><stop offset="1" stop-color="#F7F8F8" stop-opacity="0.8"/></linearGradient></defs><rect width="1280" height="320" fill="#08090A"/><rect width="1280" height="320" fill="url(#grid)" mask="url(#gm)"/><ellipse class="beam" cx="640.0" cy="0" rx="538" ry="304" fill="url(#glow)"/><polygon points="600.0,0 680.0,0 896,320 384,320" fill="url(#cone)" filter="url(#soft)"/><rect x="256" y="0" width="768" height="1" fill="#FF8A3D" opacity=".7"/><rect x="434" y="79" width="412" height="40" rx="20" fill="#141518" fill-opacity="0.85" stroke="url(#pillb)" stroke-width="1"/><circle cx="455" cy="99" r="4.5" fill="#FF8A3D"/><text x="468" y="105" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#F7F8F8">New · 15 banner styles + CTA buttons</text><text x="820" y="105" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="16.5" fill="#8A8F98">→</text><text x="640.0" y="201" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2.5" fill="url(#tgrad)">readme-forge</text><text x="640.0" y="243" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif" font-size="23" fill="#8A8F98">READMEs that look as good as your code</text><rect x="0" y="319" width="1280" height="1" fill="#FFFFFF" opacity="0.08"/></svg>
