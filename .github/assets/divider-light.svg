<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="24" viewBox="0 0 1280 24" role="img" aria-labelledby="t"><title id="t">beam divider</title><style>@keyframes comet{from{transform:translateX(0)}to{transform:translateX(1600px)}}.comet{animation:comet 5s cubic-bezier(.6,0,.4,1) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="comet" x1="0" x2="1"><stop offset="0" stop-color="#0B7FAA" stop-opacity="0"/><stop offset=".8" stop-color="#6E35A8"/><stop offset="1" stop-color="#0C131D"/></linearGradient><filter id="cg" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3"/></filter></defs><rect x="0" y="11.5" width="1280" height="1" fill="#0B7FAA" opacity=".25"/><g class="comet"><rect x="-282" y="9.0" width="256" height="6" rx="3" fill="url(#comet)" filter="url(#cg)"/><rect x="-282" y="11.0" width="256" height="2" rx="1" fill="url(#comet)"/></g></svg>
