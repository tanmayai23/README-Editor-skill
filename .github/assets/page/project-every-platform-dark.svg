.0,44.0)"><path d="M0,-8.0 Q0,0 8.0,0 Q0,0 0,8.0 Q0,0 -8.0,0 Q0,0 0,-8.0Z" fill="#19C3EC" class="glint" style="animation-delay:2.56s"/></g><g transform="translate(510.0,270.0)"><path d="M0,-6.4 Q0,0 6.4,0 Q0,0 0,6.4 Q0,0 -6.4,0 Q0,0 0,-6.4Z" fill="#3ECF8E" class="glint" style="animation-delay:2.31s"/></g></svg>
