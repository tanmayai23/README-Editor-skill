<svg xmlns="http://www.w3.org/2000/svg" width="590" height="350" viewBox="0 0 590 350" role="img" aria-label="analyze_repo.py — facts, not guesses — 15 ecosystems"><title>analyze_repo.py — facts, not guesses — 15 ecosystems</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;font-kerning:normal}.mono{font-family:'Geist Mono', 'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace}.serif{font-family:'Instrument Serif', 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-weight:400}
