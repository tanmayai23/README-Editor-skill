<svg xmlns="http://www.w3.org/2000/svg" width="384" height="96" viewBox="0 0 384 96" role="img" aria-label="On its own — no Claude account"><title>On its own — no Claude account</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;font-kerning:normal}.mono{font-family:'Geist Mono', 'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace}.serif{font-family:'Instrument Serif', 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-weight:400}
.twinkle{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glint{animation:glint 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.1s steps(1) infinite}
.ripple{animation:ripple 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.breathe{animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drop{animation:drop 3.6s cubic-bezier(.55,0,.9,.5) infinite;transform-box:fill-box;transform-origin:center top}
.zoom{animation:zoom 18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.dash{animation:dash 6s linear infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes glint{0%,100%{opacity:.15;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes ripple{0%{opacity:.6;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@keyframes drop{0%,30%{opacity:0;transform:translateY(0) scale(.4)}40%{opacity:1;transform:translateY(0) scale(1)}85%{opacity:1;transform:translateY(70px) scale(1,1.15)}100%{opacity:0;transform:translateY(84px) scale(1.2,.6)}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes dash{to{stroke-dashoffset:-84}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs></defs><rect x="4" y="4" width="376" height="88" rx="26" fill="#161B22"/><circle cx="50" cy="48" r="22" fill="#21262D" stroke="#30363D"/><path transform="translate(39.0,37.0) scale(0.9167)" d="M4 6l6 6-6 6M12 18h8" fill="none" stroke="#19C3EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="88.0" y="45.0" font-size="19" font-weight="600" fill="#F5F5F7" letter-spacing="-0.4">On its own</text><text x="88.0" y="69.0" font-size="17" font-weight="400" fill="#8B949E" class="serif">no Claude account</text><circle cx="340" cy="48" r="17" fill="#21262D" stroke="#30363D"/><path d="M334.1,54.0 L345.9,42.0 M335.8,42.0 H345.9 V52.2" fill="none" stroke="#F5F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(302.0,22.0)"><path d="M0,-6.4 Q0,0 6.4,0 Q0,0 0,6.4 Q0,0 -6.4,0 Q0,0 0,-6.4Z" fill="#3ECF8E" class="glint" style="animation-delay:1.20s"/></g></svg>
